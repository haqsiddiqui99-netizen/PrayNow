# Render blueprint — connect repo, then set JWT_SECRET + CLIENT_ORIGIN in dashboard.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: praynow-db
    plan: free
    databaseName: praynow
    user: praynow

services:
  - type: web
    name: praynow-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: praynow-db
          property: connectionString
      - key: PGSCHEMA
        value: praynow
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
